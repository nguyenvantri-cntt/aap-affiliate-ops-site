<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AAP Affiliate Ops</title>
    <style>
      :root { color-scheme: light; --ink:#14201c; --muted:#5b6b64; --accent:#0f766e; --bg:#f4f7f5; }
      * { box-sizing: border-box; }
      body { margin:0; font-family: Georgia, "Times New Roman", serif; background:linear-gradient(160deg,#eef5f1,#f8f4ef 55%,#e8f0ec); color:var(--ink); min-height:100vh; }
      main { max-width:820px; margin:0 auto; padding:64px 24px 80px; }
      .brand { font-family: "Segoe UI", system-ui, sans-serif; font-size:14px; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); font-weight:700; }
      h1 { font-size:clamp(2.2rem,5vw,3.4rem); line-height:1.05; margin:12px 0 16px; }
      p { font-size:1.1rem; line-height:1.6; color:var(--muted); }
      .links { display:flex; flex-wrap:wrap; gap:12px; margin-top:28px; }
      a.btn { font-family:"Segoe UI",system-ui,sans-serif; text-decoration:none; background:var(--accent); color:#fff; padding:12px 18px; border-radius:10px; font-weight:600; }
      a.ghost { background:transparent; color:var(--accent); border:1px solid #9cbcb2; }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">AAP Affiliate Ops</div>
      <h1>TikTok Shop affiliate ops with human confirmation</h1>
      <p>
        Web tool for planning, reviewing, and publishing TikTok Shop affiliate content.
        Official TikTok Login Kit and Content Posting API only — no scraping.
      </p>
      <div class="links">
        <a class="btn" href="terms.html">Terms of Service</a>
        <a class="btn ghost" href="privacy.html">Privacy Policy</a>
        <a class="btn ghost" href="demo.html">Integration demo</a>
      </div>
    </main>
  </body>
</html>
